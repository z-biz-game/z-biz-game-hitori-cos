name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: syntax + engine guarantees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No npm install: the game has zero runtime dependencies, and pulling Electron into CI to
      # prove nothing is how a repo starts failing on a network flake.
      - name: Syntax check every source
        run: |
          for f in $(git ls-files 'js/*.js' 'js/*/*.js'); do node --check "$f" || exit 1; done
          node --check server.cjs
          node --check electron/main.cjs
          for f in $(git ls-files 'tools/*.mjs' 'test/*.mjs'); do node --check "$f" || exit 1; done

      # The engine suites: three rule checkers that must agree cell by cell, the pencil route,
      # the state machine and the generator's own accounting.
      - name: Engine tests
        run: npm test

      # The browser scenarios are strings of page code handed to CDP. One unescaped quote inside
      # one of them reads as "the page never booted", so the parse gate runs before anything else
      # that could be misread that way.
      - name: Browser scenario bodies parse
        run: node tools/playtest.mjs selftest

      # The shipped pool has to be reproducible, not just present: re-baking on a different machine
      # must produce the same bytes, or `js/data/lots.js` is a snapshot of one laptop rather than
      # the game's content. Costs under a second.
      - name: Baked pool is reproducible
        run: |
          node tools/bake.mjs > /tmp/bake.log 2>&1
          git --no-pager diff --stat -- js/data/lots.js
          git diff --quiet -- js/data/lots.js || {
            echo "js/data/lots.js changed when re-baked — the shipped rows are not reproducible" >&2
            git --no-pager diff -- js/data/lots.js | head -40
            exit 1
          }

      # Every board must still carry solutionCount === 1 and a cross-check whose strength matches
      # its size (4x4 exhaustive, 5x5+ sampled) — the claim the README makes about the pool.
      - name: Shipped rows prove what they say
        run: node tools/audit-lots.mjs

      - name: Entry files exist
        run: test -f index.html && grep -q '<canvas' index.html && grep -q 'js/main.js' index.html

  # 真浏览器闸：headless Chrome + CDP，读 DOM 文本/几何与画布像素，不读内部标志位。
  # 独立 job，node 22 而不是 check job 的 20：台架是裸 CDP 驱动，用的是 Node 22 才有的全局
  # WebSocket/fetch；在 20 上第一次 attach 就死在 "WebSocket is not defined"，一条断言都跑不到。
  browser:
    name: real browser gate (both URL shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 196 项浏览器断言（9 个场景 boot taps rules logic routes save reloaded motion pointer）在两种 URL 形态下的条数逐条相同，是 2026-09-28 在本机实跑出来的，
      # 不是引用。在这一步之前 CI 一步都没跑过 tools/verify.sh：闸是写了给人看的，不是给人跑的。
      - name: Browser gate, root shape
        env:
          WD_TIMEOUT: 900
        run: bash tools/verify.sh

      # Pages 把这个仓发在 /z-biz-game-hitori-cos/ 之下，而根形态的服务方式分辨不出斜杠开头的 import——
      # 同组织已经因此红过一次（部署站上 404，本地闸全绿）。所以前缀形态也是闸的一部分。
      - name: Browser gate, prefix shape (how Pages serves us)
        env:
          WD_TIMEOUT: 900
        run: |
          root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$root/z-biz-game-hitori-cos"
          python3 -m http.server 5503 --bind 127.0.0.1 --directory "$root" &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null' EXIT
          for i in $(seq 1 40); do
            curl -fsS -m 2 "http://127.0.0.1:5503/z-biz-game-hitori-cos/" >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS -m 3 "http://127.0.0.1:5503/z-biz-game-hitori-cos/js/main.js" >/dev/null
          curl -fsS -m 3 "http://127.0.0.1:5503/z-biz-game-hitori-cos/js/core/solve.js" >/dev/null
          BASE_URL=http://127.0.0.1:5503/z-biz-game-hitori-cos/ bash tools/verify.sh
